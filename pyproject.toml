[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-release-gate"
version = "0.1.0"
description = "Turn agent benchmark evidence into deterministic release decisions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/bsha6/agent-release-gate"
Issues = "https://github.com/bsha6/agent-release-gate/issues"

[project.scripts]
agent-release-gate = "agent_release_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
